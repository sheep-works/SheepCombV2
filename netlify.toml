[build]
  # ビルドコマンド
  command = "pnpm --filter @sheep-family/web generate"
  # 公開ディレクトリ (Nuxt 3 の generate 出力先)
  publish = "packages/web/.output/public"
  # 変更がない場合はビルドをキャンセルする
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF packages/web/ packages/core/ packages/types/"


[build.environment]
  NODE_VERSION = "22"

# 舊ドメイン (sheepcomb.netlify.app) から新ドメイン (comb.lambuage.com) へのリダイレクト
[[redirects]]
  from = "https://sheepcomb.netlify.app/*"
  to = "https://comb.lambuage.com/:splat"
  status = 301
  force = true

# SPA ルーティングのためのリダイレクト設定
# 存在しないパスへのアクセスをすべて index.html に向けることで、
# ブラウザ側でのルーティングを可能にします。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# WASM ファイルの配信設定（念のため）
[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

